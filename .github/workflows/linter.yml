name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade pip && pip install ruff==0.14.2
      - name: Lint
        run: ruff check src ui data tests
